[package]
name = "rainmill-vault"
version = "0.1.0"
description = "A credential vault for Laterite: API keys and key files sealed at rest, pools of credentials a plugin cycles through, an allowance per credential, and a count of what each one spent"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rainmill/vault-plugin"
publish = false

# Marks this crate as a Laterite plugin and names the module it registers, so a
# tool can tell what it is without building it. Which Laterite it supports is
# stated by the dependency requirement below, never repeated here.
[package.metadata.laterite]
plugin = "rainmill.vault"

[dependencies]
# Laterite crates are version-only so this manifest is location-independent
# (identical whether dev-symlinked under an app's plugins/ tree or vendored).
laterite-core = "0.11"
# The Credentials screen, its forms and the audit log.
laterite-admin = "0.11"
# Text timestamps and the start of a credential's period.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "1"

[dev-dependencies]
laterite-core = { version = "0.11", features = ["sqlite", "postgres", "testing"] }
laterite-auth = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
